{% extends 'base.html' %}

{% block content %}

<div class="container py-5" style="max-width:500px">

    <h2 class="mb-4 text-center">Register</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-dark w-100 mt-3">
            Зареєструватися
        </button>

    </form>

    <p class="text-center mt-3">
        Вже є акаунт?
        <a href="{% url 'login' %}">Вхід</a>
    </p>

</div>

{% endblock %}
