{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-xl-7">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- HEADER -->

                <div class="bg-dark text-white p-4">

                    <h1 class="fw-bold mb-1">
                        Оформлення замовлення
                    </h1>

                    <p class="mb-0 text-light">
                        Заповніть дані для підтвердження доставки
                    </p>

                </div>

                <!-- BODY -->

                <div class="card-body p-4 p-md-5">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- ІМ’Я -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Ім’я
                            </label>

                            {{ form.name }}

                        </div>

                        <!-- ТЕЛЕФОН -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Телефон
                            </label>

                            {{ form.phone }}

                        </div>

                        <!-- АДРЕСА -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Адреса
                            </label>

                            {{ form.address }}

                        </div>

                        <!-- КОМЕНТАР -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Коментар
                            </label>

                            {{ form.comment }}

                        </div>

                        <!-- DELIVERY + PAYMENT -->

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label fw-semibold">
                                    Тип отримання
                                </label>

                                {{ form.delivery_type }}

                            </div>

                            <div class="col-md-6 mb-4">

                                <label class="form-label fw-semibold">
                                    Оплата
                                </label>

                                {{ form.payment_method }}

                            </div>

                        </div>

                        <!-- BUTTON -->

                        <button class="btn btn-dark btn-lg w-100 rounded-3 py-3 fw-semibold">

                            Підтвердити замовлення

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
